<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הזמנה - אורי פלאסט</title>
<style>
:root{--gold:#c9a84c;--gold2:#e8c97a;--bg:#0f0f1a;--card:#16213e;--border:#2a3f60;--text:#f0ead6;--muted:#8a9bb5}
*{box-sizing:border-box}
html{min-height:-webkit-fill-available}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;min-height:100vh;min-height:-webkit-fill-available;padding-bottom:calc(100px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:var(--card);padding:calc(16px + env(safe-area-inset-top)) 16px 14px;text-align:center;border-bottom:2px solid var(--gold);box-shadow:0 4px 18px rgba(0,0,0,.4)}
header small{color:var(--gold);letter-spacing:3px} h1{margin:3px 0 0;font-size:24px}
.wrap{padding:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:7px}
.row span{flex:1;font-size:14px}
.q{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.q button,.q input{width:36px;height:34px;border:0;background:var(--bg);color:var(--text);text-align:center;font-size:16px}
.q button{color:var(--gold);font-size:20px;touch-action:manipulation}
.q input::-webkit-outer-spin-button,.q input::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{width:100%;min-height:70px;background:var(--card);color:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;font-family:inherit;resize:none}
.warn{text-align:center;color:var(--gold2);font-weight:700;margin:12px 0}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--gold);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;box-shadow:0 -6px 20px rgba(0,0,0,.45)}
.send{width:auto;padding:0 18px;height:42px;border:0;background:#25D366;color:#fff;border-radius:10px;font-weight:700;font-size:15px}
#count{color:var(--gold);font-size:20px}
</style>
</head>
<body>
<header><small>✦ הזמנה ✦</small><h1>אורי פלאסט</h1></header>
<div class="wrap">
<div class='row'><span>משטח מיכל 1</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>משטח מיכל 2</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>משטח מיכל 2.5</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>משטח מיכל 4.5</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>משטח מכסה 1-2</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>משטח מכסה 4.5</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>מיכל 1 שחור</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>מיכל 3</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>מכסה 3</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>קערה 500</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>קערה 750</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>קערה 1000</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>מכסה קערה</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>גביע אור 250</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>גביע אור 500</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>מכסה אור 500</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>גביע אור 750</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<div class='row'><span>מכסה אור 750</span><div class='q'><button onclick='chg(this,-1)'>−</button><input type='number' min='0' value='0' inputmode='numeric' pattern='[0-9]*'><button onclick='chg(this,1)'>+</button></div></div>
<textarea id="notes" placeholder="הערות להזמנה..."></textarea>
<div class="warn">‼️ דווח חוסרים בהקדם האפשרי ‼️</div>
</div>
<footer><div><b id="count">0</b> פריטים</div><button class="send" onclick="sendOrder()">שלח הזמנה</button></footer>
<script>
const PHONE='972544274897';
function chg(btn,d){
  const i=btn.parentElement.querySelector('input');
  i.value=Math.max(0,(parseInt(i.value)||0)+d);
  refresh();
}
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',refresh));
function refresh(){
  let t=0;
  document.querySelectorAll('.row input').forEach(i=>t+=parseInt(i.value)||0);
  document.getElementById('count').textContent=t;
}
function sendOrder(){
  const lines=['🛒 *הזמנה - אורי פלאסט*','📅 '+new Date().toLocaleDateString('he-IL'),'─────────────────'];
  let total=0;
  document.querySelectorAll('.row').forEach(r=>{
    const q=parseInt(r.querySelector('input').value)||0;
    if(q>0){
      lines.push('• '+r.querySelector('span').textContent+': *'+q+'*');
      total+=q;
    }
  });
  if(!total){alert('לא נבחרו פריטים');return;}
  const n=document.getElementById('notes').value.trim();
  if(n)lines.push('','📝 *הערות:* '+n);
  lines.push('','─────────────────','✅ סה״כ: *'+total+' פריטים*','','‼️ *דווח חוסרים בהקדם האפשרי* ‼️','','*אשרי*');
  location.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent(lines.join('\n'));
}
</script>
</body>
</html>
