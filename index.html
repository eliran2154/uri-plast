<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>הזמנה - אורי פלאסט</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial;background:#0f0f1a;color:#f0ead6;margin:0;padding:0 0 100px;-webkit-text-size-adjust:100%}header{position:sticky;top:0;background:#16213e;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;text-align:center;border-bottom:2px solid #c9a84c}h1{margin:0;font-size:24px}.wrap{padding:10px}.row{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;background:#16213e;border:1px solid #2a3f60;border-radius:10px;padding:9px 12px;margin-bottom:7px;direction:rtl}.row span{flex:1;text-align:right;direction:rtl}.gap{height:16px}.q{display:flex;direction:rtl;flex:0 0 auto;border:1px solid #2a3f60;border-radius:8px;overflow:hidden}button,input{width:36px;height:34px;border:0;background:#0f0f1a;color:#f0ead6;text-align:center;font-size:16px}button{color:#c9a84c;font-size:20px}textarea{width:100%;box-sizing:border-box;min-height:70px;background:#16213e;color:#fff;border:1px solid #2a3f60;border-radius:10px;padding:10px}.warn{text-align:center;color:#e8c97a;font-weight:700;margin:12px 0}footer{position:fixed;bottom:0;left:0;right:0;background:#0f0f1a;border-top:2px solid #c9a84c;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center}.send{width:auto;padding:0 18px;background:#25D366;color:#fff;border-radius:10px;font-weight:700}</style></head><body><header><div>✦ הזמנה ✦</div><h1>אורי פלאסט</h1></header><div class="wrap" id="products"></div><div class="wrap"><textarea id="notes" placeholder="הערות להזמנה..."></textarea><div class="warn">‼️ דווח חוסרים בהקדם האפשרי ‼️</div></div><footer><div><b id="count">0</b> פריטים</div><button class="send" onclick="sendOrder()">שלח הזמנה</button></footer><script>const PHONE='972544274897',RLM='\u200F',LRM='\u200E';const G=[['משטח מיכל 1','משטח מיכל 2','משטח מכסה 1-2'],['משטח מיכל 2.5','משטח מיכל 4.5','משטח מכסה 4.5'],['מיכל 1 שחור','מיכל 3','מכסה 3'],['קערה 500','קערה 750','קערה 1000','מכסה קערה'],['גביע אור 250','גביע אור 500','מכסה אור 500','גביע אור 750','מכסה אור 750']];const wrap=document.getElementById('products');function addRow(p,g){const r=document.createElement('div');r.className='row';r.dataset.group=g;r.innerHTML='<span></span><div class="q"><button onclick="chg(this,-1)">−</button><input type="number" min="0" value="0" inputmode="numeric"><button onclick="chg(this,1)">+</button></div>';r.querySelector('span').textContent=p;r.querySelector('input').addEventListener('input',refresh);wrap.appendChild(r)}G.forEach((g,i)=>{if(i)wrap.insertAdjacentHTML('beforeend','<div class="gap"></div>');g.forEach(p=>addRow(p,i))});wrap.insertAdjacentHTML('beforeend','<div class="gap"></div>');addRow('‼️*לידע נהג לקח החזרות*‼️','returns');function chg(btn,d){const i=btn.parentElement.querySelector('input');i.value=Math.max(0,(parseInt(i.value)||0)+d);refresh()}function refresh(){let t=0;document.querySelectorAll('.row input').forEach(i=>t+=parseInt(i.value)||0);count.textContent=t}function orderLine(name,q){return RLM+'• '+name+RLM+': '+LRM+q+RLM}function sendOrder(){const lines=['🛒 *הזמנה - אורי פלאסט*','📅 '+new Date().toLocaleDateString('he-IL'),'─────────────────'];let total=0;[...new Set([...document.querySelectorAll('.row')].map(r=>r.dataset.group))].forEach(g=>{const sel=[];document.querySelectorAll('.row[data-group="'+g+'"]').forEach(r=>{const q=parseInt(r.querySelector('input').value)||0;if(q>0){sel.push(orderLine(r.querySelector('span').textContent,q));total+=q}});if(sel.length)lines.push('',...sel)});if(!total){alert('לא נבחרו פריטים');return}const n=notes.value.trim();if(n)lines.push('','📝 *הערות:* '+n);lines.push('','─────────────────','✅ סה״כ: *'+total+' פריטים*','','‼️ *דווח חוסרים בהקדם האפשרי* ‼️','','*אשרי*');const msg=lines.map(x=>RLM+x+RLM).join('\n');location.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg)}</script></body></html>
